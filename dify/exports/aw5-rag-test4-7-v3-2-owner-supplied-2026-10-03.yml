    - data:
        code: "import json\nimport re\n\n\ndef _unique_object(pairs):\n    result\
          \ = {}\n    for key, value in pairs:\n        if key in result:\n      \
          \      raise ValueError(\"Duplicate registry field\")\n        result[key]\
          \ = value\n    return result\n\n\ndef _identifier(value):\n    if not isinstance(value,\
          \ str) or not re.fullmatch(\n        r\"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\"\
          , value\n    ):\n        raise ValueError(\"Invalid registry identifier\"\
          )\n    return value.lower()\n\n\ndef main(registry_json: str) -> dict:\n\
          \    if not isinstance(registry_json, str) or len(registry_json.encode())\
          \ > 65_536:\n        raise ValueError(\"Registry input is missing or too\
          \ large\")\n    payload = json.loads(registry_json, object_pairs_hook=_unique_object)\n\
          \    if not isinstance(payload, dict) or payload.get(\"schema_version\"\
          ) != \"aw5.source-registry.v1\":\n        raise ValueError(\"Unsupported\
          \ registry schema\")\n    tenant = payload.get(\"tenant_id\")\n    if type(tenant)\
          \ is not int or tenant <= 0:\n        raise ValueError(\"Invalid registry\
          \ tenant\")\n    _identifier(payload.get(\"published_workflow_id\"))\n \
          \   values = payload.get(\"dataset_ids\")\n    if not isinstance(values,\
          \ list) or not values:\n        raise ValueError(\"Registry dataset selection\
          \ is missing\")\n    datasets = {_identifier(value) for value in values}\n\
          \    if len(datasets) != len(values):\n        raise ValueError(\"Duplicate\
          \ registry dataset\")\n    documents = payload.get(\"documents\")\n    if\
          \ not isinstance(documents, list) or len(documents) > 20:\n        raise\
          \ ValueError(\"Invalid registry shortlist\")\n    rows = []\n    seen =\
          \ set()\n    for document in documents:\n        if not isinstance(document,\
          \ dict):\n            raise ValueError(\"Invalid registry document\")\n\
          \        document_id = _identifier(document.get(\"document_id\"))\n    \
          \    if document_id in seen or _identifier(document.get(\"dataset_id\"))\
          \ not in datasets:\n            raise ValueError(\"Registry document is\
          \ duplicated or outside selection\")\n        seen.add(document_id)\n  \
          \      name, kind = document.get(\"document_name\"), document.get(\"document_type\"\
          )\n        if not isinstance(name, str) or not name.strip() or (kind is\
          \ not None and not isinstance(kind, str)):\n            raise ValueError(\"\
          Invalid registry document metadata\")\n        rows.append({\"document_id\"\
          : document_id, \"document_name\": name, \"document_type\": kind})\n    return\
          \ {\"json\": [{\"data\": rows}]}"
