          \n\ndef main(\n    question: str,\n    answer_text: str,\n    approved:\
          \ str,\n    decision: str,\n    required_answer_terms: list,\n) -> dict:\n\
          \    question = str(question or \"\")\n    answer_text = str(answer_text\
          \ or \"\").strip()\n    decision = str(\n        decision or \"insufficient\"\
          \n    ).strip().lower()\n\n    terms = required_answer_terms\n    if not\
          \ isinstance(terms, list):\n        terms = []\n\n    clean_terms = []\n\
          \    seen = set()\n\n    for item in terms:\n        term = str(item).strip()\n\
          \n        if not term:\n            continue\n\n        term = term[:200]\n\
          \        key = normalize_text(term)\n\n        if not key or key in seen:\n\
          \            continue\n\n        seen.add(key)\n        clean_terms.append(term)\n\
          \n        if len(clean_terms) >= 20:\n            break\n\n    normalized_answer\
          \ = normalize_text(answer_text)\n\n    missing_terms = [\n        term\n\
          \        for term in clean_terms\n        if normalize_text(term) not in\
          \ normalized_answer\n    ]\n\n    failure_reasons = []\n\n    if not truthy(approved):\n\
          \        failure_reasons.append(\"verifier_not_approved\")\n\n    if not\
