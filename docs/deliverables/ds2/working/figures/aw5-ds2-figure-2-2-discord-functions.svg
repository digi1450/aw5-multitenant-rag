<text x="40" y="56.0" fill="#14213D" font-family="Arial, sans-serif" font-weight="700" font-size="30">AW5  |  SYSTEM FUNCTIONS</text>
<text x="40" y="87.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="17">What members and administrators do; internal checks apply before any project retrieval</text>
<text x="250" y="172.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="700" font-size="14">AW5 FUNCTIONAL BOUNDARY</text>
<text x="55" y="255.0" fill="#14213D" font-family="Arial, sans-serif" font-weight="700" font-size="19">Member</text>
<text x="55" y="287.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Discord user</text>
<text x="282" y="242.0" fill="#14213D" font-family="Arial, sans-serif" font-weight="700" font-size="19">1  Ticket interaction</text>
<text x="282" y="274.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Start private ticket</text>
<text x="282" y="293.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Choose project if multiple</text>
<text x="282" y="312.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Ask • /list • /close</text>
<text x="585" y="242.0" fill="#14213D" font-family="Arial, sans-serif" font-weight="700" font-size="19">2  Access &amp; session</text>
<text x="585" y="274.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Fetch current Discord role</text>
<text x="585" y="293.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Derive AW5 tenant_id</text>
<text x="585" y="312.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Bind user + thread + tenant</text>
<text x="585" y="331.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Deny if check fails</text>
<text x="895" y="242.0" fill="#14213D" font-family="Arial, sans-serif" font-weight="700" font-size="19">3  Knowledge answer</text>
<text x="895" y="274.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Validate Published files</text>
<text x="895" y="293.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Retrieve within project</text>
<text x="895" y="312.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Answer + real citations</text>
<text x="895" y="331.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">or insufficient evidence</text>
<text x="55" y="525.0" fill="#14213D" font-family="Arial, sans-serif" font-weight="700" font-size="19">Administrator</text>
<text x="55" y="557.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Project / Dify</text>
<text x="282" y="484.0" fill="#14213D" font-family="Arial, sans-serif" font-weight="700" font-size="19">4  Project knowledge administration</text>
<text x="282" y="516.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Register role → tenant → Dify app in AW5</text>
<text x="282" y="535.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Onboard files with correct tenant metadata</text>
<text x="282" y="554.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Publish project app in Dify UI</text>
<text x="282" y="573.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">No AW5 admin UI yet</text>
<text x="721" y="484.0" fill="#14213D" font-family="Arial, sans-serif" font-weight="700" font-size="19">5  Operations &amp; safeguards</text>
<text x="721" y="516.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Keep Dify credentials in backend only</text>
<text x="721" y="535.0" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Observe errors, latency and provider usage</text>
<text x="721" y="554.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">Fail closed on missing/mismatched metadata</text>
<text x="721" y="573.1" fill="#60718B" font-family="Arial, sans-serif" font-weight="400" font-size="15">No AW5 per-user question/token quota</text>
<text x="40" y="697.0" fill="#B45309" font-family="Arial, sans-serif" font-weight="700" font-size="14">Figure status: Nature Footprint demo exists; multi-role live behavior and Project B isolation need controlled verification.</text>
</svg>
