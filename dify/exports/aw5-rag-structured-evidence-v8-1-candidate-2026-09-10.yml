    - data:
        code: "import json\n\ndef main(results: list, query: str) -> dict:\n    if\
          \ results is None:\n        results = []\n    if not isinstance(results,\
          \ list):\n        raise ValueError(\"results must be an array\")\n    enriched\
          \ = []\n    blocks = []\n    for index, item in enumerate(results):\n  \
          \      if not isinstance(item, dict):\n            continue\n        content\
          \ = item.get(\"content\")\n        if not isinstance(content, str) or not\
          \ content.strip():\n            continue\n        metadata = item.get(\"\
          metadata\") if isinstance(item.get(\"metadata\"), dict) else {}\n      \
          \  source = {}\n        for key in (\"document_id\", \"document_name\",\
          \ \"dataset_id\", \"dataset_name\"):\n            value = metadata.get(key)\n\
          \            if isinstance(value, str) and value.strip():\n            \
          \    source[key] = value.strip()\n        output = dict(item)\n        output[\"\
          content\"] = (\n            \"SOURCE_METADATA: \"\n            + json.dumps(source,\
          \ ensure_ascii=False, separators=(\",\", \":\"))\n            + \"\\n\\\
          n\"\n            + content.strip()\n        )\n        enriched.append(output)\n\
          \        blocks.append(\"=== RETRIEVED ITEM \" + str(index + 1) + \" ===\\\
          n\" + output[\"content\"])\n    return {\n        \"result\": enriched,\n\
          \        \"context_text\": \"\\n\\n\".join(blocks),\n        \"has_evidence\"\
          : bool(enriched),\n        \"evidence_count\": len(enriched),\n    }\n"
        code_language: python3
        outputs:
