<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AW5 MVP System Architecture Overview</title>
  <desc id="desc">Proposed Microsoft Teams delivery, trusted AW5 authorization backend, local self-hosted Dify and project knowledge bases, and external cloud model APIs.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #475569; }
      .zone-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .zone-subtitle { font: 500 12px Inter, Arial, sans-serif; fill: #64748b; letter-spacing: 0.4px; }
      .card-title { font: 700 15px Inter, Arial, sans-serif; fill: #172033; }
      .card-body { font: 400 12px Inter, Arial, sans-serif; fill: #475569; }
      .small { font: 500 11px Inter, Arial, sans-serif; fill: #64748b; }
      .pill { font: 700 10px Inter, Arial, sans-serif; letter-spacing: 0.8px; }
      .flow-label { font: 600 11px Inter, Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <circle cx="1500" cy="60" r="220" fill="#e8efff" opacity="0.65"/>
  <circle cx="75" cy="940" r="190" fill="#e8f7f1" opacity="0.70"/>

  <text x="60" y="66" class="title">AW5 MVP System Architecture</text>
  <text x="60" y="94" class="subtitle">Proposed DS2 design • Microsoft Teams delivery • backend-derived project tenant authorization</text>

  <g transform="translate(1110,42)">
    <rect x="0" y="0" width="122" height="28" rx="14" fill="#dbeafe"/>
    <circle cx="16" cy="14" r="5" fill="#2563eb"/>
    <text x="29" y="18" class="pill" fill="#1d4ed8">PROPOSED MVP</text>
    <rect x="132" y="0" width="130" height="28" rx="14" fill="#d1fae5"/>
    <circle cx="148" cy="14" r="5" fill="#059669"/>
    <text x="161" y="18" class="pill" fill="#047857">CURRENT EVIDENCE</text>
    <rect x="272" y="0" width="106" height="28" rx="14" fill="#e2e8f0"/>
    <circle cx="288" cy="14" r="5" fill="#64748b"/>
    <text x="301" y="18" class="pill" fill="#475569">EXTERNAL API</text>
  </g>

  <!-- Microsoft 365 zone -->
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="320" height="745" rx="24" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <rect x="55" y="135" width="320" height="68" rx="24" fill="#eef2ff"/>
  <rect x="55" y="178" width="320" height="25" fill="#eef2ff"/>
  <text x="80" y="166" class="zone-title">Microsoft 365 Boundary</text>
  <text x="80" y="187" class="zone-subtitle">IDENTITY + CONVERSATION SURFACE</text>

  <g transform="translate(80,230)">
    <rect width="270" height="112" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="36" cy="39" r="20" fill="#dbeafe"/>
    <circle cx="36" cy="34" r="7" fill="#2563eb"/>
    <path d="M23 54c3-10 23-10 26 0" fill="#2563eb"/>
    <text x="70" y="35" class="card-title">Organization user</text>
    <text x="70" y="57" class="card-body">Project member or admin</text>
    <text x="24" y="86" class="small">Personal chat — other members do not</text>
    <text x="24" y="102" class="small">share the same conversation view</text>
  </g>

  <g transform="translate(80,365)">
    <rect width="270" height="118" rx="16" fill="#f3f0ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="24" y="25" width="42" height="42" rx="10" fill="#635bff"/>
    <text x="38" y="53" font-family="Inter, Arial" font-weight="800" font-size="21" fill="#ffffff">T</text>
    <text x="82" y="39" class="card-title">Microsoft Teams</text>
    <text x="82" y="61" class="card-body">Personal bot conversation</text>
    <text x="24" y="91" class="small">Questions in • answers + citations out</text>
  </g>

  <g transform="translate(80,510)">
    <rect width="270" height="106" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
    <path d="M28 26h36v36H28z" rx="8" fill="#2563eb"/>
    <path d="M37 43l7 7 13-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="38" class="card-title">Microsoft Entra ID</text>
    <text x="82" y="60" class="card-body">Single sign-on identity</text>
    <text x="24" y="86" class="small">Stable organization user identity</text>
  </g>

  <g transform="translate(80,643)">
    <rect width="270" height="135" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="45" cy="43" r="21" fill="#e2e8f0"/>
    <path d="M34 43h22M45 32v22" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="38" class="card-title">Microsoft Graph</text>
    <text x="82" y="60" class="card-body">Membership / role changes</text>
    <text x="24" y="91" class="small">Owner → project_admin</text>
    <text x="24" y="108" class="small">Member → project_member</text>
    <text x="24" y="125" class="small">Guest → denied by default</text>
  </g>

  <!-- Trusted AW5 boundary -->
  <g filter="url(#shadow)">
    <rect x="410" y="135" width="585" height="745" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
  </g>
  <rect x="410" y="135" width="585" height="68" rx="24" fill="#eaf2ff"/>
  <rect x="410" y="178" width="585" height="25" fill="#eaf2ff"/>
  <text x="435" y="166" class="zone-title">Trusted AW5 Application Boundary</text>
  <text x="435" y="187" class="zone-subtitle">PROPOSED MVP • AUTHORIZATION DECISION POINT</text>
  <rect x="846" y="153" width="124" height="26" rx="13" fill="#dbeafe"/>
  <text x="865" y="170" class="pill" fill="#1d4ed8">PROPOSED MVP</text>

  <g transform="translate(440,230)">
    <rect width="245" height="120" rx="16" fill="#f8fbff" stroke="#bfdbfe"/>
    <rect x="20" y="22" width="40" height="40" rx="10" fill="#2563eb"/>
    <path d="M31 42h18M40 33v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="36" class="card-title">Teams Bot Adapter</text>
    <text x="75" y="58" class="card-body">Public HTTPS ingress</text>
    <text x="20" y="91" class="small">Verify request + token • normalize</text>
    <text x="20" y="108" class="small">message and render citation cards</text>
  </g>

  <g transform="translate(720,230)">
    <rect width="245" height="120" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <path d="M40 20l22 9v17c0 16-10 27-22 33-12-6-22-17-22-33V29z" fill="#f97316"/>
    <path d="M29 46l7 7 15-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="36" class="card-title">Authorization Service</text>
    <text x="78" y="58" class="card-body">Derive tenant_id + role</text>
    <text x="20" y="91" class="small">Fail closed before retrieval</text>
    <text x="20" y="108" class="small">User input never grants scope</text>
  </g>

  <g transform="translate(440,385)">
    <rect width="245" height="118" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <ellipse cx="43" cy="31" rx="22" ry="9" fill="#64748b"/>
    <path d="M21 31v34c0 5 10 9 22 9s22-4 22-9V31" fill="#e2e8f0" stroke="#64748b"/>
    <path d="M21 48c0 5 10 9 22 9s22-4 22-9" fill="none" stroke="#64748b"/>
    <text x="82" y="36" class="card-title">Membership Store</text>
    <text x="82" y="58" class="card-body">User ↔ tenant ↔ role</text>
    <text x="20" y="93" class="small">One Team maps to one AW5 tenant</text>
  </g>

  <g transform="translate(720,385)">
    <rect width="245" height="118" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="43" cy="42" r="23" fill="#e2e8f0"/>
    <path d="M31 42h24M43 30v24" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="36" class="card-title">Conversation Service</text>
    <text x="82" y="58" class="card-body">Private session mapping</text>
    <text x="20" y="93" class="small">platform_user_id + tenant_id</text>
  </g>

  <g transform="translate(440,538)">
    <rect width="525" height="120" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="22" y="24" width="46" height="46" rx="12" fill="#059669"/>
    <path d="M33 47h24M48 36l11 11-11 11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="38" class="card-title">Dify Gateway</text>
    <text x="86" y="61" class="card-body">Trusted tenant → Dify app mapping • server-side credentials only</text>
    <text x="86" y="86" class="small">MVP topology: one Dify app per AW5 project tenant</text>
    <rect x="385" y="22" width="116" height="24" rx="12" fill="#dbeafe"/>
    <text x="405" y="38" class="pill" fill="#1d4ed8">PROPOSED MVP</text>
  </g>

  <g transform="translate(440,694)">
    <rect width="525" height="132" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <path d="M24 73l14-18 14 10 18-29 18 17" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="55" r="4" fill="#2563eb"/>
    <circle cx="52" cy="65" r="4" fill="#2563eb"/>
    <circle cx="70" cy="36" r="4" fill="#2563eb"/>
    <text x="105" y="38" class="card-title">Operational Observability</text>
    <text x="105" y="59" class="card-body">Cross-cutting monitoring for AW5 backend and Dify</text>
    <text x="105" y="78" class="small">Authorization • latency • tokens • provider errors • estimated cost</text>
    <rect x="105" y="86" width="310" height="30" rx="15" fill="#eff6ff"/>
    <text x="124" y="106" class="flow-label">No AW5 per-user query or token quota</text>
    <text x="105" y="128" class="small">Per-request timeout and bounded retry remain technical safeguards.</text>
  </g>

  <!-- Owner computer + external zone -->
  <g filter="url(#shadow)">
    <rect x="1030" y="135" width="515" height="500" rx="24" fill="#ffffff" stroke="#6ee7b7" stroke-width="2.5"/>
  </g>
  <rect x="1030" y="135" width="515" height="68" rx="24" fill="#ecfdf5"/>
  <rect x="1030" y="178" width="515" height="25" fill="#ecfdf5"/>
  <text x="1055" y="166" class="zone-title">Owner's Computer / Project Server</text>
  <text x="1055" y="187" class="zone-subtitle">LOCAL DIFY + PERSISTENT PROJECT DATA</text>
  <rect x="1398" y="153" width="122" height="26" rx="13" fill="#d1fae5"/>
  <text x="1416" y="170" class="pill" fill="#047857">CURRENT EVIDENCE</text>

