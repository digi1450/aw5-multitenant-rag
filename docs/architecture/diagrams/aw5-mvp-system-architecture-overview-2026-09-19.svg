    <circle cx="48" cy="49" r="27" fill="#10b981"/>
    <path d="M33 49l12 12 20-25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="93" y="38" class="card-title">Self-hosted Dify 1.17.0</text>
    <text x="93" y="61" class="card-body">Local RAG platform and project-app runtime</text>
    <text x="93" y="83" class="small">Hosts tenant-specific Dify applications</text>
  </g>

  <g transform="translate(1060,365)">
    <rect width="282" height="215" rx="17" fill="#f0fdf4" stroke="#86efac"/>
    <text x="22" y="33" class="card-title">Tenant 1 • Nature Footprint</text>
    <text x="22" y="54" class="small">Dify App A • current-main five-node workflow</text>
    <rect x="22" y="76" width="238" height="32" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="38" y="97" class="card-body">Knowledge Base — TOR</text>
    <rect x="22" y="118" width="238" height="32" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="38" y="139" class="card-body">Knowledge Base — SDS</text>
    <rect x="22" y="160" width="238" height="32" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="38" y="181" class="card-body">Knowledge Base — ER/dbdiagram</text>
  </g>

  <g transform="translate(1364,365)">
    <rect width="151" height="215" rx="17" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="7 5"/>
    <text x="18" y="34" class="card-title">Project B</text>
    <text x="18" y="57" class="small">Dify App B • real project</text>
    <rect x="18" y="79" width="115" height="62" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="33" y="105" class="card-body">Project</text>
    <text x="33" y="124" class="card-body">Knowledge Bases</text>
    <rect x="18" y="157" width="115" height="30" rx="15" fill="#dbeafe"/>
    <text x="34" y="177" class="pill" fill="#1d4ed8">PLANNED TENANT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="665" width="515" height="215" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="1030" y="665" width="515" height="58" rx="24" fill="#f1f5f9"/>
  <rect x="1030" y="700" width="515" height="23" fill="#f1f5f9"/>
  <text x="1055" y="700" class="zone-title">External Cloud Model APIs</text>
  <rect x="1408" y="681" width="112" height="26" rx="13" fill="#e2e8f0"/>
  <text x="1428" y="698" class="pill" fill="#475569">EXTERNAL API</text>

  <g transform="translate(1060,746)">
    <rect width="210" height="96" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="22" y="33" class="card-title">Embedding API</text>
    <text x="22" y="55" class="card-body">Chunks during indexing</text>
    <text x="22" y="74" class="card-body">Query text at retrieval</text>
  </g>
  <g transform="translate(1290,746)">
    <rect width="225" height="96" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="22" y="33" class="card-title">Answer LLM</text>
    <text x="22" y="55" class="card-body">Question + selected evidence</text>
    <text x="22" y="74" class="card-body">+ included conversation history</text>
  </g>

