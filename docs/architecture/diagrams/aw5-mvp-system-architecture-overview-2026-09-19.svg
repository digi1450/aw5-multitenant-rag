  <!-- Footer note -->
  <rect x="55" y="915" width="1490" height="50" rx="16" fill="#0f172a"/>
  <text x="80" y="938" font-family="Inter, Arial" font-size="13" font-weight="700" fill="#ffffff">Security invariant</text>
  <text x="80" y="957" font-family="Inter, Arial" font-size="12" fill="#cbd5e1">The backend derives AW5 tenant_id from authenticated membership. User text, client-supplied IDs, and model output cannot authorize retrieval.</text>
</svg>
