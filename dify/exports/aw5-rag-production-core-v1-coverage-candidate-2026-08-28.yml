    - data:
        code: "import re\n\n\ndef main(\n    question: str,\n    tor_query: str,\n\
          \    sds_query: str,\n    er_query: str,\n    use_tor: str,\n    use_sds:\
          \ str,\n    use_er: str,\n) -> dict:\n    question = (question or \"\").strip()\n\
          \    lower = question.lower()\n    upper = question.upper()\n\n    def truthy(value):\n\
          \        return str(value).strip().lower() in {\"true\", \"1\", \"yes\"\
          , \"y\"}\n\n    def normalize_query(value):\n        tokens = re.split(r\"\
          \\s+\", (value or \"\").strip())\n        result = []\n        seen = set()\n\
          \        for token in tokens:\n            key = token.casefold()\n    \
          \        if not token or key in seen:\n                continue\n      \
