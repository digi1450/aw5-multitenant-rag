          arg4:
            type: mixed
            value: null
          query:
            type: mixed
            value: "WITH input_query AS (\n    SELECT lower($arg0) AS q\n),\nregistry\
              \ AS (\n    SELECT\n        d.id AS document_id,\n        d.name AS\
              \ document_name,\n        jsonb_extract_path_text(d.doc_metadata, 'document_type')\
              \ AS document_type\n    FROM documents d\n    WHERE jsonb_extract_path_text(d.doc_metadata,\
              \ 'tenant_id') = '1'\n      AND d.enabled = true\n      AND d.archived\
              \ = false\n      AND d.indexing_status = 'completed'\n),\nscored AS\
              \ (\n    SELECT\n        r.*,\n        CASE\n            WHEN length(replace(i.q,\
              \ lower(r.document_name), '')) < length(i.q) THEN 100\n            ELSE\
              \ 0\n        END\n        + CASE\n            WHEN EXISTS (\n      \
              \          SELECT 1\n                FROM regexp_split_to_table(i.q,\
              \ '[^[:alnum:]]+') AS term\n                WHERE term = lower(r.document_type)\n\
              \            ) THEN 50\n            ELSE 0\n        END\n        + (\n\
              \            SELECT count(DISTINCT name_term) * 10\n            FROM\
              \ regexp_split_to_table(\n                lower(regexp_replace(r.document_name,\
              \ '\\.[^.]+$', '')),\n                '[^[:alnum:]]+'\n            )\
              \ AS name_term\n            JOIN regexp_split_to_table(i.q, '[^[:alnum:]]+')\
              \ AS query_term\n              ON name_term = query_term\n         \
              \   WHERE length(name_term) >= 3\n        ) AS match_score\n    FROM\
              \ registry r\n    CROSS JOIN input_query i\n)\nSELECT document_id, document_name,\
              \ document_type\nFROM scored\nWHERE match_score > 0\nORDER BY match_score\
              \ DESC, document_name\nLIMIT 20;"
