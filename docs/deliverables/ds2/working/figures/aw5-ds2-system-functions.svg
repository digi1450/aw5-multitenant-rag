<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="236" viewBox="0 0 1100 236" role="img" aria-labelledby="title desc">
  <title id="title">Main AW5 system functions</title>
  <desc id="desc">A member asks through Microsoft Teams, the backend authenticates and authorizes a project tenant, Dify retrieves project evidence and composes an answer, and Teams displays the answer and citations.</desc>
  <rect width="1100" height="236" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#14213d" text-anchor="middle">
    <rect x="22" y="48" width="188" height="112" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="116" y="87" font-size="19" font-weight="700">Microsoft Teams</text>
    <text x="116" y="117" font-size="14">Personal bot question</text>
    <rect x="241" y="48" width="188" height="112" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="335" y="84" font-size="18" font-weight="700">Authenticate</text>
    <text x="335" y="110" font-size="14">Entra ID + request</text>
    <text x="335" y="131" font-size="14">validation</text>
    <rect x="460" y="48" width="188" height="112" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="554" y="84" font-size="18" font-weight="700">Authorize</text>
    <text x="554" y="110" font-size="14">Derive project tenant</text>
    <text x="554" y="131" font-size="14">from membership</text>
    <rect x="679" y="48" width="188" height="112" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="773" y="84" font-size="18" font-weight="700">Retrieve + answer</text>
    <text x="773" y="110" font-size="14">Project Dify app and</text>
    <text x="773" y="131" font-size="14">Knowledge Bases</text>
    <rect x="898" y="48" width="180" height="112" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="988" y="84" font-size="18" font-weight="700">Return result</text>
    <text x="988" y="110" font-size="14">Answer + citations or</text>
    <text x="988" y="131" font-size="14">insufficient evidence</text>
    <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M212 104h22"/><path d="M431 104h22"/><path d="M650 104h22"/><path d="M869 104h22"/>
    </g>
    <g fill="#64748b">
      <path d="m236 104-9-6v12z"/><path d="m455 104-9-6v12z"/><path d="m674 104-9-6v12z"/><path d="m893 104-9-6v12z"/>
    </g>
    <text x="550" y="198" font-size="15" fill="#475569">Administrator-controlled documents and operational monitoring support the request flow.</text>
  </g>
</svg>
