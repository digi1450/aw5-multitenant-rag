    - data:
        code: "import re\n\ndef main(ledger: dict, results: list, query: str) -> dict:\n\
          \    ledger = ledger if isinstance(ledger, dict) else {}\n    results =\
          \ results if isinstance(results, list) else []\n    query = query if isinstance(query,\
          \ str) else \"\"\n    by_source = {}\n    for item in results:\n       \
          \ if not isinstance(item, dict):\n            continue\n        metadata\
          \ = item.get(\"metadata\") if isinstance(item.get(\"metadata\"), dict) else\
          \ {}\n        name = metadata.get(\"document_name\")\n        content =\
          \ item.get(\"content\")\n        if not isinstance(name, str) or not name.strip()\
          \ or not isinstance(content, str):\n            continue\n        raw =\
          \ content.split(\"\\n\\n\", 1)[1] if content.startswith(\"SOURCE_METADATA:\"\
          ) and \"\\n\\n\" in content else content\n        by_source.setdefault(name.strip(),\
          \ []).append((item, raw))\n\n    def locate(source_name, quote):\n     \
          \   if not isinstance(source_name, str) or not isinstance(quote, str) or\
          \ not quote.strip():\n            return None\n        normalized = \" \"\
          .join(quote.split())\n        for item, raw in by_source.get(source_name,\
          \ []):\n            if normalized in \" \".join(raw.split()):\n        \
          \        return item\n        return None\n\n    query_normalized = \" \"\
          .join(query.casefold().split())\n    generic_tokens = {\"pdf\", \"txt\"\
          , \"doc\", \"docx\", \"file\", \"attach\"}\n    def source_score(name):\n\
          \        tokens = [t for t in re.findall(r\"[a-z0-9ก-๙]+\", name.casefold())\
          \ if len(t) >= 3 and t not in generic_tokens]\n        return sum(1 for\
          \ token in tokens if token in query_normalized)\n\n    candidates = []\n\
          \    uncovered = []\n    rejected = 0\n    relationship_found = False\n\
          \    for facet_index, facet in enumerate(ledger.get(\"facets\") or [], start=1):\n\
          \        if not isinstance(facet, dict):\n            continue\n       \
          \ found = 0\n        for evidence in facet.get(\"evidence\") or []:\n  \
          \          if not isinstance(evidence, dict):\n                continue\n\
          \            source_name = evidence.get(\"source_name\")\n            quote\
          \ = evidence.get(\"quote\")\n            evidence_type = evidence.get(\"\
          evidence_type\")\n            item = locate(source_name, quote)\n      \
          \      if item is None:\n                rejected += 1\n               \
          \ continue\n            found += 1\n            if evidence_type == \"relationship\"\
          :\n                relationship_found = True\n            candidates.append({\"\
          source_name\": source_name, \"quote\": quote.strip(), \"normalized_quote\"\
          : \" \".join(quote.split()), \"evidence_type\": evidence_type, \"item\"\
          : item, \"source_score\": source_score(source_name)})\n        if found\
          \ == 0:\n            uncovered.append(facet_index)\n\n    deduped = []\n\
          \    by_quote = {}\n    for row in candidates:\n        key = row[\"normalized_quote\"\
          ]\n        if key not in by_quote:\n            by_quote[key] = len(deduped)\n\
          \            deduped.append(row)\n        elif row[\"source_score\"] > deduped[by_quote[key]][\"\
          source_score\"]:\n            deduped[by_quote[key]] = row\n\n    item_quotes\
          \ = {}\n    item_order = []\n    evidence_lines = []\n    for row in deduped:\n\
          \        item = row[\"item\"]\n        metadata = item.get(\"metadata\"\
          ) if isinstance(item.get(\"metadata\"), dict) else {}\n        item_key\
          \ = str(metadata.get(\"segment_id\") or metadata.get(\"id\") or (row[\"\
          source_name\"], item.get(\"content\")))\n        if item_key not in item_quotes:\n\
          \            item_quotes[item_key] = {\"item\": item, \"quotes\": []}\n\
          \            item_order.append(item_key)\n        if row[\"quote\"] not\
          \ in item_quotes[item_key][\"quotes\"]:\n            item_quotes[item_key][\"\
          quotes\"].append(row[\"quote\"])\n        kind = \"SCHEMA\" if row[\"evidence_type\"\
          ] == \"schema\" else (\"RELATIONSHIP\" if row[\"evidence_type\"] == \"relationship\"\
          \ else \"EVIDENCE\")\n        evidence_lines.append(\"[\" + kind + \" |\
          \ \" + str(row[\"source_name\"]) + \"]\\n\" + row[\"quote\"])\n\n    selected_results\
          \ = []\n    for key in item_order:\n        original = item_quotes[key][\"\
          item\"]\n        output = dict(original)\n        output[\"content\"] =\
          \ \"\\n\\n\".join(item_quotes[key][\"quotes\"])\n        selected_results.append(output)\n\
          \n    comparison_requested = any(marker in query_normalized for marker in\
          \ (\"เทียบ\", \"เปรียบเทียบ\", \"ตรงกัน\", \"ส่วนใดเชื่อมโยง\", \"จากข้อกำหนด\"\
          , \"compare\", \"comparison\", \"cross-source\", \"map requirements\", \"\
          mapping between\"))\n    if comparison_requested and not relationship_found:\n\
          \        evidence_lines.append(\"[VALIDATED LIMITATION]\\nข้อความที่ผ่านการตรวจจากแต่ละแหล่งไม่ได้ระบุการแมปข้ามแหล่งโดยตรง\
          \ จึงยืนยันได้เฉพาะหลักฐานที่แสดงไว้\")\n    if uncovered:\n        evidence_lines.append(\"\
          [VALIDATED LIMITATION]\\nมี \" + str(len(uncovered)) + \" ส่วนของคำถามที่ไม่มี\
          \ exact quote ผ่านการตรวจใน context รอบนี้\")\n    return {\"evidence_text\"\
          : \"\\n\\n\".join(evidence_lines), \"selected_results\": selected_results,\
          \ \"accepted_quote_count\": len(deduped), \"rejected_quote_count\": rejected,\
          \ \"uncovered_facet_count\": len(uncovered)}\n"
        code_language: python3
        outputs:
          accepted_quote_count:
            children: null
            type: number
          evidence_text:
            children: null
            type: string
          rejected_quote_count:
            children: null
            type: number
          selected_results:
            children: null
            type: array[object]
          uncovered_facet_count:
            children: null
            type: number
        selected: false
        title: Validate Evidence Ledger
