    - data:
        code: "def main(results: list) -> dict:\n    enriched_results = []\n\n   \
          \ for item in results or []:\n        if not isinstance(item, dict):\n \
          \           continue\n\n        enriched_item = dict(item)\n        metadata\
          \ = enriched_item.get(\"metadata\") or {}\n\n        document_name = metadata.get(\"\
          document_name\") or \"unknown\"\n        dataset_name = metadata.get(\"\
          dataset_name\") or \"unknown\"\n        content = enriched_item.get(\"content\"\
          ) or \"\"\n\n        enriched_item[\"content\"] = (\n            f\"[document_name:\
          \ {document_name}]\\n\"\n            f\"[dataset_name: {dataset_name}]\\\
          n\"\n            f\"{content}\"\n        )\n\n        enriched_results.append(enriched_item)\n\
          \n    return {\"result\": enriched_results}"
        code_language: python3
