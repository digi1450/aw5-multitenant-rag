  <text x="982" y="435" class="flow-label">Dify API</text>

  <path d="M1288 340 L1288 365" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1405 340 L1405 365" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowBlue)"/>
  <text x="1416" y="354" class="flow-label">planned App B</text>
  <path d="M1100 340 C1015 365 1015 794 1060 794" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowGray)"/>
