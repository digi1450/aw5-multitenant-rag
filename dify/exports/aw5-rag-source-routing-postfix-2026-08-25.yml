    - data:
        code: "def main(route: dict) -> dict:\n    route = route or {}\n\n    def\
          \ truthy(value):\n        if value is True:\n            return True\n \
          \       return str(value).strip().lower() in {\"true\", \"1\", \"yes\",\
          \ \"y\"}\n\n    def query(name):\n        value = route.get(name, \"\")\n\
          \        if isinstance(value, str) and value.strip():\n            return\
          \ value.strip()\n        return \"ข้อมูลโครงการ\"\n\n    return {\n    \
          \    \"tor_query\": query(\"tor_query\"),\n        \"sds_query\": query(\"\
          sds_query\"),\n        \"er_query\": query(\"er_query\"),\n        \"use_tor\"\
          : \"true\" if truthy(route.get(\"use_tor\")) else \"false\",\n        \"\
          use_sds\": \"true\" if truthy(route.get(\"use_sds\")) else \"false\",\n\
          \        \"use_er\": \"true\" if truthy(route.get(\"use_er\")) else \"false\"\
          ,\n    }"
