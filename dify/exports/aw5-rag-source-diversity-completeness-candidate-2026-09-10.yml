    - data:
        code: |-
          import json


          def main(results: list, query: str) -> dict:
              if results is None:
                  results = []

              if not isinstance(results, list):
                  raise ValueError("results must be an array")

              if not isinstance(query, str):
                  query = ""

              query_normalized = " ".join(query.casefold().split())

              valid_items = []

              for item in results:
                  if not isinstance(item, dict):
                      continue

                  content = item.get("content")
                  if not isinstance(content, str) or not content.strip():
                      continue

                  metadata = item.get("metadata")
                  if not isinstance(metadata, dict):
                      metadata = {}

                  document_name = metadata.get("document_name", "")
                  if not isinstance(document_name, str):
                      document_name = ""

                  valid_items.append({
                      "item": item,
                      "metadata": metadata,
                      "document_name": document_name.strip(),
                      "document_name_normalized": document_name.strip().casefold(),
                  })

              # ตรวจว่าผู้ใช้จำกัดขอบเขตแหล่งข้อมูลอย่างชัดเจนหรือไม่
              thai_restriction = (
                  "เฉพาะ" in query_normalized
                  and "โดยเฉพาะ" not in query_normalized
              )

              english_restriction = any(
                  marker in query_normalized
                  for marker in (
                      "only ",
                      " only",
                      "solely",
                      "exclusively",
                  )
              )

              has_restriction = thai_restriction or english_restriction

              # ตรวจชื่อเอกสารจาก metadata ที่ retrieval ส่งมาจริง
              # ไม่มีการ hardcode ชื่อ TOR, SDS หรือ ER
              matched_document_names = set()

              for entry in valid_items:
                  document_name = entry["document_name_normalized"]

                  if not document_name:
                      continue

                  # จับทั้งชื่อเต็มและชื่อที่ตัดนามสกุลแล้ว
                  if "." in document_name:
                      document_stem = document_name.rsplit(".", 1)[0]
                  else:
                      document_stem = document_name

                  full_name_match = document_name in query_normalized
                  stem_match = (
                      len(document_stem) >= 4
                      and document_stem in query_normalized
                  )

                  if full_name_match or stem_match:
                      matched_document_names.add(document_name)

              # ตรวจว่าคำถามกล่าวถึงชื่อไฟล์อย่างชัดเจนหรือไม่
              normalized_tokens = (
                  query_normalized
                  .replace("`", " ")
                  .replace('"', " ")
                  .replace("'", " ")
                  .replace("(", " ")
                  .replace(")", " ")
                  .split()
              )

              supported_extensions = (
                  ".pdf",
                  ".txt",
                  ".md",
                  ".doc",
                  ".docx",
                  ".csv",
                  ".xls",
                  ".xlsx",
              )

              explicit_file_reference = any(
                  token.rstrip(".,;:!?").endswith(supported_extensions)
                  for token in normalized_tokens
              )

              source_restricted = (
                  has_restriction
                  and (
                      bool(matched_document_names)
                      or explicit_file_reference
                  )
              )

              if source_restricted:
                  if matched_document_names:
                      # คำถามระบุ "เฉพาะ" และพบเอกสารนั้นจริง
                      selected_entries = [
                          entry
                          for entry in valid_items
                          if entry["document_name_normalized"]
                          in matched_document_names
                      ]
                  else:
                      # ผู้ใช้ระบุไฟล์แบบจำกัดขอบเขต
                      # แต่ retrieval ไม่ได้ส่งไฟล์นั้นมา
                      # ส่ง context ว่างเพื่อป้องกันการตอบจากไฟล์อื่น
                      selected_entries = []
              else:
                  # Preserve source diversity for questions that may require
                  # evidence across multiple project documents.
                  selected_indexes = []
                  seen_documents = set()

                  for index, entry in enumerate(valid_items):
                      document_name = entry["document_name_normalized"]

                      if document_name and document_name not in seen_documents:
                          selected_indexes.append(index)
                          seen_documents.add(document_name)

                      if len(selected_indexes) >= 10:
                          break

                  for index in range(len(valid_items)):
                      if len(selected_indexes) >= 10:
                          break

                      if index not in selected_indexes:
                          selected_indexes.append(index)

                  selected_entries = [
                      valid_items[index]
                      for index in selected_indexes
                  ]

              enriched_results = []

              for entry in selected_entries:
                  item = entry["item"]
                  metadata = entry["metadata"]
                  content = item["content"]

                  source = {}

                  for key in (
                      "document_id",
                      "document_name",
                      "dataset_id",
                      "dataset_name",
                  ):
                      value = metadata.get(key)

                      if isinstance(value, str) and value.strip():
                          source[key] = value.strip()

                  enriched_item = dict(item)
                  enriched_item["content"] = (
                      "SOURCE_METADATA: "
                      + json.dumps(
                          source,
                          ensure_ascii=False,
                          separators=(",", ":"),
                      )
                      + "\n\n"
                      + content.strip()
                  )

                  enriched_results.append(enriched_item)

              return {
                  "result": enriched_results,
                  "has_evidence": bool(enriched_results),
                  "evidence_count": len(enriched_results),
              }
        code_language: python3
        outputs:
          evidence_count:
