    - data:
        code: "def main(\n    tor_results: list,\n    use_tor: str,\n    sds_results:\
          \ list,\n    use_sds: str,\n    er_results: list,\n    use_er: str,\n) ->\
          \ dict:\n    def enabled(value):\n        return (\n            value is\
          \ True\n            or str(value or \"\").strip().lower()\n            in\
          \ {\"true\", \"1\", \"yes\", \"y\"}\n        )\n\n    merged = []\n    seen_segments\
          \ = set()\n\n    manifest = []\n    seen_sources = set()\n\n    sources\
          \ = (\n        (\"TOR\", enabled(use_tor), tor_results or []),\n       \
          \ (\"SDS\", enabled(use_sds), sds_results or []),\n        (\"ER\", enabled(use_er),\
          \ er_results or []),\n    )\n\n    for source_type, use_source, rows in\
          \ sources:\n        if not use_source:\n            continue\n\n       \
          \ for item in rows:\n            if not isinstance(item, dict):\n      \
          \          continue\n\n            metadata = item.get(\"metadata\") or\
          \ {}\n\n            segment_key = (\n                str(metadata.get(\"\
          dataset_id\") or \"\"),\n                str(metadata.get(\"document_id\"\
          ) or \"\"),\n                str(metadata.get(\"segment_id\") or \"\"),\n\
          \                str(item.get(\"content\") or \"\"),\n            )\n\n\
          \            if segment_key not in seen_segments:\n                seen_segments.add(segment_key)\n\
          \                merged.append(item)\n\n            document_name = str(\n\
          \                metadata.get(\"document_name\")\n                or item.get(\"\
          document_name\")\n                or item.get(\"title\")\n             \
          \   or \"\"\n            ).strip()\n\n            if document_name:\n  \
          \              source_key = (\n                    source_type,\n      \
          \              document_name,\n                )\n\n                if source_key\
          \ not in seen_sources:\n                    seen_sources.add(source_key)\n\
          \                    manifest.append(\n                        f\"{source_type}:\
          \ {document_name}\"\n                    )\n\n    source_manifest = \"\\\
          n\".join(manifest)\n\n    return {\n        \"result\": merged,\n      \
          \  \"source_manifest\": source_manifest,\n    }"
