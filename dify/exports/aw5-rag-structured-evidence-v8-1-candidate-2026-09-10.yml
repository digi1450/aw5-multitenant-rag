    - data:
        code: "def main(ledger: dict, results: list, query: str) -> dict:\n    ledger\
          \ = ledger if isinstance(ledger, dict) else {}\n    results = results if\
          \ isinstance(results, list) else []\n    query = query if isinstance(query,\
          \ str) else \"\"\n    by_source = {}\n    for item in results:\n       \
          \ if not isinstance(item, dict):\n            continue\n        metadata\
          \ = item.get(\"metadata\") if isinstance(item.get(\"metadata\"), dict) else\
          \ {}\n        name = metadata.get(\"document_name\")\n        content =\
          \ item.get(\"content\")\n        if not isinstance(name, str) or not name.strip()\
          \ or not isinstance(content, str):\n            continue\n        raw =\
          \ content.split(\"\\n\\n\", 1)[1] if content.startswith(\"SOURCE_METADATA:\"\
          ) and \"\\n\\n\" in content else content\n        by_source.setdefault(name.strip(),\
          \ []).append((item, raw))\n\n    thai = ledger.get(\"language\") == \"th\"\
          \n    selected = []\n    selected_keys = set()\n    accepted = 0\n    rejected\
          \ = 0\n    relationship_found = False\n    rendered = []\n    uncovered\
          \ = []\n\n    def locate(source_name, quote):\n        if not isinstance(source_name,\
          \ str) or not isinstance(quote, str) or not quote.strip():\n           \
          \ return None\n        normalized = \" \".join(quote.split())\n        for\
          \ item, raw in by_source.get(source_name, []):\n            if normalized\
          \ in \" \".join(raw.split()):\n                return item\n        return\
          \ None\n\n    for facet_index, facet in enumerate(ledger.get(\"facets\"\
          ) or [], start=1):\n        if not isinstance(facet, dict):\n          \
          \  continue\n        label = (\"ประเด็นที่ \" + str(facet_index)) if thai\
          \ else (\"Facet \" + str(facet_index))\n        evidence_rows = []\n   \
          \     for evidence in facet.get(\"evidence\") or []:\n            if not\
          \ isinstance(evidence, dict):\n                continue\n            source_name\
          \ = evidence.get(\"source_name\")\n            quote = evidence.get(\"quote\"\
          )\n            evidence_type = evidence.get(\"evidence_type\")\n       \
          \     item = locate(source_name, quote)\n            if item is None:\n\
          \                rejected += 1\n                continue\n            accepted\
          \ += 1\n            if evidence_type == \"relationship\":\n            \
          \    relationship_found = True\n            evidence_rows.append((source_name,\
          \ quote.strip(), evidence_type))\n            metadata = item.get(\"metadata\"\
          ) if isinstance(item.get(\"metadata\"), dict) else {}\n            key =\
          \ metadata.get(\"segment_id\") or metadata.get(\"id\") or (source_name,\
          \ item.get(\"content\"))\n            key = str(key)\n            if key\
          \ not in selected_keys:\n                selected_keys.add(key)\n      \
          \          selected.append(item)\n        if not evidence_rows:\n      \
          \      uncovered.append(label)\n            continue\n        rendered.append(\"\
          ## \" + label)\n        for source_name, quote, evidence_type in evidence_rows:\n\
          \            rendered.append(\"\\n### \" + str(source_name))\n         \
          \   if evidence_type == \"schema\":\n                rendered.append(\"\\\
          n```text\\n\" + quote + \"\\n```\")\n            else:\n               \
          \ rendered.append(\"\\n> \" + quote.replace(\"\\n\", \"\\n> \"))\n\n   \
          \ normalized_query = \" \".join(query.casefold().split())\n    comparison_requested\
          \ = any(marker in normalized_query for marker in (\n        \"เทียบ\", \"\
          เปรียบเทียบ\", \"ตรงกัน\", \"ส่วนใดเชื่อมโยง\", \"จากข้อกำหนด\",\n     \
          \   \"compare\", \"comparison\", \"cross-source\", \"map requirements\"\
          , \"mapping between\",\n    ))\n    if comparison_requested and not relationship_found:\n\
          \        rendered.append(\"\\n## \" + (\"ส่วนที่ยังยืนยันไม่ได้\" if thai\
          \ else \"Unverified relationship\"))\n        rendered.append(\"\\n\" +\
          \ (\n            \"ข้อความที่ผ่านการตรวจจากแต่ละแหล่งไม่ได้ระบุการแมปข้ามแหล่งโดยตรง\
          \ จึงยืนยันได้เฉพาะหลักฐานที่แสดงแยกตามประเด็นข้างต้น\"\n            if\
          \ thai else\n            \"The validated passages do not explicitly state\
          \ a cross-source mapping, so only the separately presented evidence above\
          \ is confirmed.\"\n        ))\n    if uncovered:\n        rendered.append(\"\
          \\n## \" + (\"ประเด็นที่หลักฐานยังไม่ครบ\" if thai else \"Facets without\
          \ validated evidence\"))\n        for label in uncovered:\n            rendered.append(\"\
          \\n- \" + label)\n\n    if not rendered:\n        rendered.append(\"ไม่พบข้อความตรงที่ผ่านการตรวจใน\
          \ context รอบนี้\" if thai else \"No exact passage passed validation in\
          \ this run's context.\")\n    return {\n        \"answer\": \"\\n\".join(rendered),\n\
          \        \"selected_results\": selected,\n        \"accepted_quote_count\"\
          : accepted,\n        \"rejected_quote_count\": rejected,\n        \"uncovered_facet_count\"\
          : len(uncovered),\n    }\n"
        code_language: python3
        outputs:
          accepted_quote_count:
            children: null
            type: number
          answer:
            children: null
            type: string
          rejected_quote_count:
            children: null
            type: number
          selected_results:
            children: null
            type: array[object]
          uncovered_facet_count:
            children: null
            type: number
        selected: false
        title: Validate Evidence Ledger
        type: code
        variables:
