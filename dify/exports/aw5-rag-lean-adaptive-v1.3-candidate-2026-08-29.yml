    - data:
        code: |
          import re


          def guarded_route(
              question: str,
              tor_query: str,
              sds_query: str,
              er_query: str,
              use_tor: str,
              use_sds: str,
              use_er: str,
          ) -> dict:
              question = (question or "").strip()
              lower = question.lower()
              upper = question.upper()

              def truthy(value):
                  return str(value).strip().lower() in {
                      "true", "1", "yes", "y"
                  }

              def has_source_token(token):
                  return re.search(
                      rf"(?<![a-z0-9_]){re.escape(token)}(?![a-z0-9_])",
                      lower,
                  ) is not None

              # รับผล routing เดิมจาก LLM1
              tor = truthy(use_tor)
              sds = truthy(use_sds)
              er = truthy(use_er)
              reason = "keep_llm_route"

              # ตรวจชื่อเอกสารหรือรหัส source ที่ระบุโดยตรง
              named_tor = (
                  has_source_token("tor")
                  or "attach_tor_1" in lower
              )

              named_sds = (
                  has_source_token("sds")
                  or "system design specification" in lower
              )

              named_er = (
                  has_source_token("er")
                  or "er_dbdiagram" in lower
              )

              # ตรวจ identifier ของฐานข้อมูล
              schema_identifier = re.search(
                  r"\b(?:UM|CALC|MD|ORG|CM)_[A-Z0-9_]+\b",
                  upper,
              ) is not None

              # สัญญาณคำถามเกี่ยวกับโครงสร้างฐานข้อมูล
              database_signal = (
                  schema_identifier
                  or "ตารางใด" in question
                  or "ตารางอะไร" in question
                  or "คอลัมน์" in question
                  or "foreign key" in lower
                  or "primary key" in lower
                  or "ฐานข้อมูล" in question
                  or "database schema" in lower
              )

              # สัญญาณ SDS ที่ชัดเจน
              sds_signal = any(term in lower for term in [
                  "รูปที่",
                  "หน้าจอ",
                  "indicator calculation ui",
                  "upload/import design",
                  "นำเข้าผ่านไฟล์",
                  "validation",
              ])

              # สัญญาณ TOR ที่ชัดเจน
              tor_signal = (
                  "ข้อกำหนด" in question
                  or "ขอบเขตงาน" in question
                  or "งบประมาณ" in question
                  or re.search(r"\btor\s*ข้อ", lower) is not None
              )

              named_count = sum([
                  named_tor,
                  named_sds,
                  named_er,
              ])

              # ผู้ใช้ระบุหลายแหล่งโดยตรง
              if named_count >= 2:
                  tor = named_tor
                  sds = named_sds
                  er = named_er or database_signal
                  reason = "explicit_multi_source"

              # ผู้ใช้ระบุแหล่งเดียวโดยตรง
              elif named_count == 1:
                  tor = named_tor
                  sds = named_sds
                  er = named_er

                  # หากถาม schema ชัดเจนร่วมกับ TOR/SDS ให้เพิ่ม ER
                  if database_signal and not named_er:
                      er = True

                  reason = "explicit_named_source"

              # คำถามโครงสร้างฐานข้อมูลโดยไม่ระบุเอกสาร
              elif database_signal:
                  tor = False
                  sds = False
                  er = True
                  reason = "database_only"

              # คำถามรูป หน้าจอ Upload หรือ Validation
              elif sds_signal:
                  tor = False
                  sds = True
                  er = False
                  reason = "sds_design_only"

              # คำถามข้อกำหนดหรือขอบเขต TOR
              elif tor_signal:
                  tor = True
                  sds = False
                  er = False
                  reason = "tor_requirement_only"

              queries = {
                  "tor": (tor_query or "").strip(),
                  "sds": (sds_query or "").strip(),
                  "er": (er_query or "").strip(),
              }

              # ปิด source เมื่อ query ว่างหรือเป็น fallback ทั่วไป
              invalid_queries = {
                  "",
                  "ข้อมูลโครงการ",
              }

              if tor and queries["tor"] in invalid_queries:
                  tor = False
                  reason += "|blank_tor_disabled"

              if sds and queries["sds"] in invalid_queries:
                  sds = False
                  reason += "|blank_sds_disabled"

              if er and queries["er"] in invalid_queries:
                  er = False
                  reason += "|blank_er_disabled"

              return {
                  "use_tor": "true" if tor else "false",
                  "use_sds": "true" if sds else "false",
                  "use_er": "true" if er else "false",
                  "tor_query": queries["tor"] if tor else "",
                  "sds_query": queries["sds"] if sds else "",
                  "er_query": queries["er"] if er else "",
                  "guard_reason": reason,
              }


          def main(
              question: str,
              tor_results: list,
              use_tor: str,
              sds_results: list,
              use_sds: str,
              er_results: list,
              use_er: str,
          ) -> dict:
              guarded = guarded_route(
                  question,
                  "route-query-present",
                  "route-query-present",
                  "route-query-present",
                  use_tor,
                  use_sds,
                  use_er,
              )

              def enabled(value):
                  return value is True or str(value).strip().lower() in {
                      "true", "1", "yes", "y"
                  }

              merged = []
              seen = set()

              for use, rows in (
                  (enabled(guarded["use_tor"]), tor_results or []),
                  (enabled(guarded["use_sds"]), sds_results or []),
                  (enabled(guarded["use_er"]), er_results or []),
              ):
                  if not use:
                      continue

                  for item in rows:
                      if not isinstance(item, dict):
                          continue

                      metadata = item.get("metadata") or {}
                      key = (
                          str(metadata.get("dataset_id") or ""),
                          str(metadata.get("document_id") or ""),
                          str(metadata.get("segment_id") or ""),
                          item.get("content") or "",
                      )

                      if key in seen:
                          continue

                      seen.add(key)
                      merged.append(item)

              return {"result": merged}
