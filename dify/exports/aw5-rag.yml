          def main(
              scope_mode: str,
              document_names_csv: str,
              strict: str
          ) -> dict:
              mode = (scope_mode or "").strip().upper()
              names = (document_names_csv or "").strip()
              restriction = (strict or "").strip().upper()

              if restriction not in ("STRICT", "NON_STRICT"):
                  return {"filter_names": ""}

              if mode == "ALL" and restriction == "NON_STRICT":
                  return {"filter_names": None}

              if mode == "SELECTED" and names:
                  if restriction == "STRICT":
                      return {"filter_names": names}
                  return {"filter_names": None}

              return {"filter_names": ""}
