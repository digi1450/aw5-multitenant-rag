    - data:
        code: "import json\n\nMAX_CONTEXT_CHUNKS = 15\n\ndef _registry_document_ids(source_registry:\
          \ list) -> dict:\n    if not isinstance(source_registry, list):\n      \
          \  raise ValueError(\"source_registry must be an array\")\n\n    by_name\
          \ = {}\n    for entry in source_registry:\n        if not isinstance(entry,\
          \ dict):\n            raise ValueError(\"source_registry entries must be\
          \ objects\")\n        rows = entry.get(\"data\", [entry])\n        if not\
          \ isinstance(rows, list):\n            raise ValueError(\"source_registry\
          \ data must be an array\")\n        for row in rows:\n            if not\
          \ isinstance(row, dict):\n                raise ValueError(\"source_registry\
          \ rows must be objects\")\n            name = row.get(\"document_name\"\
          )\n            document_id = row.get(\"document_id\")\n            if (\n\
          \                isinstance(name, str)\n                and name\n     \
          \           and isinstance(document_id, str)\n                and document_id.strip()\n\
          \            ):\n                by_name.setdefault(name, set()).add(document_id)\n\
          \    return by_name\n\n\ndef _finish(entries: list, report: dict) -> dict:\n\
          \    enriched_results = []\n    for entry in entries:\n        source =\
          \ {}\n        for key in (\"document_id\", \"document_name\", \"dataset_id\"\
          , \"dataset_name\"):\n            value = entry[\"metadata\"].get(key)\n\
          \            if isinstance(value, str) and value.strip():\n            \
          \    source[key] = value.strip()\n\n        enriched_item = dict(entry[\"\
          item\"])\n        enriched_item[\"content\"] = (\n            \"SOURCE_METADATA:\
          \ \"\n            + json.dumps(source, ensure_ascii=False, separators=(\"\
          ,\", \":\"))\n            + \"\\n\\n\"\n            + entry[\"content\"\
          ]\n        )\n        enriched_results.append(enriched_item)\n\n    if report[\"\
          candidate_coverage\"] == \"unresolved\":\n        fallback_message = (\n\
          \            \"ยังระบุไฟล์ที่อ้างถึงไม่ได้แน่ชัด \"\n            \"กรุณาระบุชื่อไฟล์เต็มหรือรายละเอียดที่ช่วยแยกไฟล์ที่ต้องการ\"\
          \n        )\n    elif not enriched_results:\n        fallback_message =\
          \ (\n            \"ยังไม่พบหลักฐานที่เพียงพอจากการค้นหาครั้งนี้ \"\n   \
          \         \"กรุณาระบุหัวข้อ เลขข้อ หรือรายละเอียดที่ต้องการเพิ่มเติม\"\n\
          \        )\n    else:\n        fallback_message = \"\"\n\n    return {\n\
          \        \"fallback_message\": fallback_message,\n        \"result\": enriched_results,\n\
          \        \"has_evidence\": bool(enriched_results),\n        \"evidence_count\"\
          : len(enriched_results),\n        \"selection_report\": json.dumps(report,\
          \ ensure_ascii=False, separators=(\",\", \":\")),\n    }\n\n\ndef main(\n\
          \    results: list,\n    scope_mode: str,\n    document_names_csv: str,\n\
          \    source_registry: list,\n    strict: str,\n    seek_other_sources: bool,\n\
          ) -> dict:\n    if results is None:\n        results = []\n    if not isinstance(results,\
          \ list):\n        raise ValueError(\"results must be an array\")\n    if\
          \ not isinstance(scope_mode, str):\n        raise ValueError(\"scope_mode\
          \ must be a string\")\n\n    mode = scope_mode.strip().upper()\n    if mode\
          \ not in (\"ALL\", \"SELECTED\", \"UNRESOLVED\"):\n        raise ValueError(\"\
          invalid scope_mode\")\n\n    if not isinstance(strict, str):\n        raise\
          \ ValueError(\"strict must be a string\")\n    restriction = strict.strip().upper()\n\
          \    if restriction not in (\"STRICT\", \"NON_STRICT\"):\n        raise\
          \ ValueError(\"invalid strict\")\n    # Dify's single-node form can submit\
          \ nested structured-output values as text.\n    # Accept only explicit JSON\
          \ Boolean literals; never use bool(text).\n    if isinstance(seek_other_sources,\
          \ str):\n        literal = seek_other_sources.strip()\n        if literal\
          \ in (\"true\", \"false\"):\n            seek_other_sources = literal ==\
          \ \"true\"\n    if not isinstance(seek_other_sources, bool):\n        raise\
          \ ValueError(\"seek_other_sources must be a boolean or true/false text\"\
          )\n\n    report = {\n        \"scope_mode\": mode,\n        \"candidate_coverage\"\
          : \"not_required\",\n        \"required_sources\": [],\n        \"required_sources_present\"\
          : [],\n        \"required_sources_not_retrieved\": [],\n        \"required_sources_omitted_by_limit\"\
          : [],\n        \"required_sources_unresolved\": [],\n        \"other_source_status\"\
          : \"not_requested\",\n    }\n    if mode == \"UNRESOLVED\":\n        report[\"\
          candidate_coverage\"] = \"unresolved\"\n        return _finish([], report)\n\
          \n    valid_items = []\n    best_by_document_id = {}\n    for original_index,\
          \ item in enumerate(results):\n        if not isinstance(item, dict):\n\
          \            continue\n        content = item.get(\"content\")\n       \
          \ if not isinstance(content, str) or not content.strip():\n            continue\n\
          \        metadata = item.get(\"metadata\")\n        if not isinstance(metadata,\
          \ dict):\n            metadata = {}\n        valid_items.append({\n    \
          \        \"original_index\": original_index,\n            \"item\": item,\n\
          \            \"content\": content.strip(),\n            \"metadata\": metadata,\n\
          \        })\n        document_id = metadata.get(\"document_id\")\n     \
          \   if isinstance(document_id, str) and document_id.strip():\n         \
          \   best_by_document_id.setdefault(document_id, original_index)\n\n    if\
          \ mode == \"ALL\":\n        return _finish(valid_items[:MAX_CONTEXT_CHUNKS],\
          \ report)\n\n    if not isinstance(document_names_csv, str) or not document_names_csv.strip():\n\
          \        raise ValueError(\"SELECTED requires document_names_csv\")\n  \
          \  required_names = list(dict.fromkeys(document_names_csv.split(\",\")))\n\
          \    if any(not name.strip() for name in required_names):\n        raise\
          \ ValueError(\"document_names_csv contains an empty source\")\n\n    # Names\
          \ are copied exactly; IDs come from the supplied runtime registry.\n   \
          \ by_name = _registry_document_ids(source_registry)\n    unresolved = [name\
          \ for name in required_names if len(by_name.get(name, set())) != 1]\n  \
          \  if unresolved:\n        report[\"candidate_coverage\"] = \"unresolved\"\
          \n        report[\"required_sources_unresolved\"] = unresolved\n       \
          \ return _finish([], report)\n\n    required_ids = {name: next(iter(by_name[name]))\
          \ for name in required_names}\n    report[\"required_sources\"] = [\n  \
          \      {\"document_name\": name, \"document_id\": required_ids[name]}\n\
          \        for name in required_names\n    ]\n\n    # Overflow is decided\
          \ by retrieval rank, not the resolver's name order.\n    anchors = sorted({\n\
          \        best_by_document_id[document_id]\n        for document_id in required_ids.values()\n\
          \        if document_id in best_by_document_id\n    })\n    selected_indices\
          \ = set(anchors[:MAX_CONTEXT_CHUNKS])\n    required_id_set = set(required_ids.values())\n\
          \    eligible_items = valid_items\n    if restriction == \"STRICT\":\n \
          \       # Keep only identifiable required-source candidates, including during\
          \ fill.\n        eligible_items = [\n            entry for entry in valid_items\n\
          \            if isinstance(entry[\"metadata\"].get(\"document_id\"), str)\n\
          \            and entry[\"metadata\"][\"document_id\"] in required_id_set\n\
          \        ]\n\n    if seek_other_sources and restriction == \"NON_STRICT\"\
          :\n        # At most one anchor outside the selected source set; no extra\
          \ retrieval.\n        other_anchor = next((\n            entry for entry\
          \ in eligible_items\n            if isinstance(entry[\"metadata\"].get(\"\
          document_id\"), str)\n            and entry[\"metadata\"][\"document_id\"\
          ].strip()\n            and entry[\"metadata\"][\"document_id\"] not in required_id_set\n\
          \        ), None)\n        if other_anchor is None:\n            report[\"\
          other_source_status\"] = \"not_retrieved\"\n        elif len(selected_indices)\
          \ >= MAX_CONTEXT_CHUNKS:\n            report[\"other_source_status\"] =\
          \ \"omitted_by_limit\"\n        else:\n            selected_indices.add(other_anchor[\"\
          original_index\"])\n            report[\"other_source_status\"] = \"present\"\
          \n\n    for entry in eligible_items:\n        if len(selected_indices) >=\
          \ MAX_CONTEXT_CHUNKS:\n            break\n        selected_indices.add(entry[\"\
          original_index\"])\n\n    # Iterating the original ranked list preserves\
          \ order and selects each item once.\n    selected_items = [\n        entry\
          \ for entry in eligible_items\n        if entry[\"original_index\"] in selected_indices\n\
          \    ]\n    for name in required_names:\n        best_index = best_by_document_id.get(required_ids[name])\n\
          \        if best_index is None:\n            report[\"required_sources_not_retrieved\"\
          ].append(name)\n        elif best_index not in selected_indices:\n     \
          \       report[\"required_sources_omitted_by_limit\"].append(name)\n   \
          \     else:\n            report[\"required_sources_present\"].append(name)\n\
          \n    report[\"candidate_coverage\"] = (\n        \"partial\"\n        if\
          \ report[\"required_sources_not_retrieved\"] or report[\"required_sources_omitted_by_limit\"\
          ]\n        else \"complete\"\n    )\n    return _finish(selected_items,\
          \ report)"
