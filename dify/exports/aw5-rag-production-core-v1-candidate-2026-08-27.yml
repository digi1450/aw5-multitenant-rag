        code: |
          def main(tor_results: list, use_tor: str, sds_results: list, use_sds: str, er_results: list, use_er: str) -> dict:
              def enabled(value):
                  return value is True or str(value).strip().lower() in {"true", "1", "yes", "y"}

              merged = []
              seen = set()

              for use, rows in (
                  (enabled(use_tor), tor_results or []),
                  (enabled(use_sds), sds_results or []),
                  (enabled(use_er), er_results or []),
              ):
                  if not use:
                      continue
                  for item in rows:
                      if not isinstance(item, dict):
                          continue
                      metadata = item.get("metadata") or {}
                      key = (
                          str(metadata.get("dataset_id") or ""),
                          str(metadata.get("document_id") or ""),
                          str(metadata.get("segment_id") or ""),
                          item.get("content") or "",
                      )
                      if key in seen:
                          continue
                      seen.add(key)
                      merged.append(item)

              return {"result": merged}
