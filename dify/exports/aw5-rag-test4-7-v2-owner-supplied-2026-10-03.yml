    - data:
        code: "import json\n\n\ndef main(results: list) -> dict:\n    if results is\
          \ None:\n        results = []\n\n    if not isinstance(results, list):\n\
          \        raise ValueError(\"results must be an array\")\n\n    valid_items\
          \ = []\n\n    # กรองรายการที่ใช้ไม่ได้ก่อน\n    # โดยรักษาลำดับ relevance\
          \ จาก Knowledge Retrieval\n    for item in results:\n        if not isinstance(item,\
          \ dict):\n            continue\n\n        content = item.get(\"content\"\
          )\n\n        if not isinstance(content, str) or not content.strip():\n \
          \           continue\n\n        metadata = item.get(\"metadata\")\n\n  \
          \      if not isinstance(metadata, dict):\n            metadata = {}\n\n\
          \        valid_items.append({\n            \"item\": item,\n           \
          \ \"content\": content.strip(),\n            \"metadata\": metadata,\n \
          \       })\n\n    enriched_results = []\n\n    # เลือก valid Top 10 ตามลำดับเดิมจาก\
          \ Knowledge Retrieval\n    for entry in valid_items[:10]:\n        item\
          \ = entry[\"item\"]\n        content = entry[\"content\"]\n        metadata\
          \ = entry[\"metadata\"]\n\n        source = {}\n\n        for key in (\n\
          \            \"document_id\",\n            \"document_name\",\n        \
          \    \"dataset_id\",\n            \"dataset_name\",\n        ):\n      \
          \      value = metadata.get(key)\n\n            if isinstance(value, str)\
          \ and value.strip():\n                source[key] = value.strip()\n\n  \
          \      enriched_item = dict(item)\n        enriched_item[\"content\"] =\
          \ (\n            \"SOURCE_METADATA: \"\n            + json.dumps(\n    \
          \            source,\n                ensure_ascii=False,\n            \
          \    separators=(\",\", \":\"),\n            )\n            + \"\\n\\n\"\
          \n            + content\n        )\n\n        enriched_results.append(enriched_item)\n\
          \n    return {\n        \"result\": enriched_results,\n        \"has_evidence\"\
          : bool(enriched_results),\n        \"evidence_count\": len(enriched_results),\n\
          \    }"
