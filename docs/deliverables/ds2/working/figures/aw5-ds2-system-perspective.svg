<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="345" viewBox="0 0 1100 345" role="img" aria-labelledby="title desc">
  <title id="title">AW5 system perspective</title>
  <desc id="desc">Microsoft 365 sends authenticated requests to a trusted AW5 backend. The backend authorizes a project tenant before calling self-hosted Dify. Dify uses external embedding and answer model APIs.</desc>
  <rect width="1100" height="345" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#172033">
    <rect x="22" y="53" width="235" height="208" rx="17" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="139" y="94" font-size="23" font-weight="700">Microsoft 365</text>
    <text x="139" y="133" font-size="18">Teams personal bot</text>
    <text x="139" y="164" font-size="18">Entra ID identity</text>
    <text x="139" y="195" font-size="18">Graph membership</text>
    <rect x="296" y="53" width="235" height="208" rx="17" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="413" y="94" font-size="22" font-weight="700">AW5 backend</text>
    <text x="413" y="133" font-size="18">Bot adapter</text>
    <text x="413" y="164" font-size="18">Authorization</text>
    <text x="413" y="195" font-size="18">Conversation + gateway</text>
    <rect x="570" y="53" width="235" height="208" rx="17" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="687" y="94" font-size="22" font-weight="700">Owner's server</text>
    <text x="687" y="133" font-size="18">Self-hosted Dify</text>
    <text x="687" y="164" font-size="18">Project apps + KBs</text>
    <text x="687" y="195" font-size="18">Local persistence</text>
    <rect x="844" y="53" width="234" height="208" rx="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="961" y="94" font-size="22" font-weight="700">Cloud models</text>
    <text x="961" y="144" font-size="18">Embedding API</text>
    <text x="961" y="178" font-size="18">Answer LLM</text>
    <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M260 157h27"/><path d="M534 157h27"/><path d="M808 157h27"/>
    </g>
    <g fill="#64748b">
      <path d="m289 157-10-7v14z"/><path d="m563 157-10-7v14z"/><path d="m837 157-10-7v14z"/>
    </g>
    <text x="550" y="313" font-size="17" fill="#475569">The backend derives the project tenant from verified membership before retrieval.</text>
  </g>
</svg>
