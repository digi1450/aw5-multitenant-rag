    - data:
        code: "import re\n\ndef main(query: str):\n    text = query or \"\"\n\n  \
          \  # รองรับชื่อที่เขียนแบบ Markdown เช่น Attach\\_TOR\\_1.pdf\n    normalized\
          \ = re.sub(r\"\\\\([_.()\\-])\", r\"\\1\", text)\n\n    extensions = r\"\
          (?:pdf|txt|docx|xlsx|csv)\"\n\n    quoted = re.findall(\n        rf\"\"\"\
          [`\"']([^`\"']+?\\.{extensions})[`\"']\"\"\",\n        normalized,\n   \
          \     flags=re.IGNORECASE,\n    )\n\n    unquoted = re.findall(\n      \
          \  rf\"\"\"([A-Za-z0-9][A-Za-z0-9 _().\\-]{{0,180}}\\.{extensions})\"\"\"\
          ,\n        normalized,\n        flags=re.IGNORECASE,\n    )\n\n    names\
          \ = []\n    for name in quoted + unquoted:\n        name = name.strip()\n\
          \        if name and name not in names:\n            names.append(name)\n\
          \n    # กรองเมื่อพบชื่อเดียว\n    # ไม่พบหรือพบหลายชื่อ ให้ค้นทุกเอกสาร\n\
          \    source_filter = names[0] if len(names) == 1 else \"\"\n\n    return\
          \ {\n        \"source_filter\": source_filter,\n        \"named_sources\"\
          : names,\n        \"named_source_count\": len(names),\n    }"
        code_language: python3
        outputs:
          named_source_count:
            children: null
            type: number
          named_sources:
            children: null
            type: array[string]
          source_filter:
            children: null
            type: string
