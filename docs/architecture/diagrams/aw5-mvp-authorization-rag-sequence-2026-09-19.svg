<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AW5 Authorization and RAG Request Sequence</title>
  <desc id="desc">Fail-closed authorization flow from a Teams user through the trusted AW5 backend to a tenant-specific Dify app and project knowledge bases.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #475569; }
      .actor-title { font: 700 14px Inter, Arial, sans-serif; fill: #172033; }
      .actor-subtitle { font: 500 11px Inter, Arial, sans-serif; fill: #64748b; }
      .step { font: 600 12px Inter, Arial, sans-serif; fill: #334155; }
      .note-title { font: 700 13px Inter, Arial, sans-serif; fill: #172033; }
      .note-body { font: 400 12px Inter, Arial, sans-serif; fill: #475569; }
      .pill { font: 700 10px Inter, Arial, sans-serif; letter-spacing: 0.7px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <circle cx="1480" cy="80" r="210" fill="#e8efff" opacity="0.65"/>
  <circle cx="85" cy="930" r="180" fill="#e8f7f1" opacity="0.75"/>

  <text x="60" y="66" class="title">Authorization &amp; RAG Request Sequence</text>
  <text x="60" y="94" class="subtitle">Fail closed before retrieval • one conversation scope per platform_user_id + tenant_id</text>

  <!-- Group boundary headers -->
  <rect x="45" y="125" width="320" height="790" rx="24" fill="#eef2ff" opacity="0.55"/>
  <rect x="382" y="125" width="760" height="790" rx="24" fill="#eaf2ff" opacity="0.50" stroke="#93c5fd" stroke-dasharray="8 6"/>
  <rect x="1159" y="125" width="396" height="790" rx="24" fill="#ecfdf5" opacity="0.55"/>
  <text x="70" y="152" class="pill" fill="#4f46e5">MICROSOFT 365</text>
  <text x="407" y="152" class="pill" fill="#1d4ed8">TRUSTED AW5 APPLICATION BOUNDARY</text>
  <text x="1184" y="152" class="pill" fill="#047857">OWNER'S COMPUTER + MODEL API</text>

  <!-- Actor cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="180" height="88" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="280" y="175" width="180" height="88" rx="16" fill="#ffffff" stroke="#a5b4fc"/>
    <rect x="500" y="175" width="190" height="88" rx="16" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="730" y="175" width="190" height="88" rx="16" fill="#ffffff" stroke="#fb923c"/>
    <rect x="960" y="175" width="170" height="88" rx="16" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="1180" y="175" width="180" height="88" rx="16" fill="#ffffff" stroke="#34d399"/>
    <rect x="1390" y="175" width="140" height="88" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <circle cx="106" cy="214" r="20" fill="#dbeafe"/>
  <circle cx="106" cy="208" r="7" fill="#2563eb"/>
  <path d="M94 228c3-9 21-9 24 0" fill="#2563eb"/>
  <text x="137" y="208" class="actor-title">User</text>
  <text x="137" y="228" class="actor-subtitle">Project member</text>

  <rect x="302" y="195" width="38" height="38" rx="9" fill="#635bff"/>
  <text x="315" y="221" font-family="Inter, Arial" font-weight="800" font-size="19" fill="#fff">T</text>
  <text x="351" y="208" class="actor-title">Teams</text>
  <text x="351" y="228" class="actor-subtitle">Personal bot chat</text>

  <text x="523" y="208" class="actor-title">Bot Adapter</text>
  <text x="523" y="228" class="actor-subtitle">Verify platform request</text>

  <path d="M760 196l18 7v14c0 13-8 22-18 27-10-5-18-14-18-27v-14z" fill="#f97316"/>
  <text x="792" y="208" class="actor-title">Authorization</text>
  <text x="792" y="228" class="actor-subtitle">Derive tenant + role</text>

  <text x="980" y="208" class="actor-title">Dify Gateway</text>
  <text x="980" y="228" class="actor-subtitle">Tenant → app mapping</text>

  <text x="1202" y="208" class="actor-title">Dify + KBs</text>
  <text x="1202" y="228" class="actor-subtitle">Authorized project corpus</text>

  <text x="1412" y="208" class="actor-title">Cloud API</text>
  <text x="1412" y="228" class="actor-subtitle">Embedding / LLM</text>

  <!-- Lifelines -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6">
    <line x1="160" y1="263" x2="160" y2="875"/>
    <line x1="370" y1="263" x2="370" y2="875"/>
    <line x1="595" y1="263" x2="595" y2="875"/>
    <line x1="825" y1="263" x2="825" y2="875"/>
    <line x1="1045" y1="263" x2="1045" y2="875"/>
    <line x1="1270" y1="263" x2="1270" y2="875"/>
    <line x1="1460" y1="263" x2="1460" y2="875"/>
  </g>

  <!-- Messages -->
  <path d="M160 305 L370 305" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="203" y="294" class="step">1. Ask project question</text>

  <path d="M370 355 L595 355" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="399" y="344" class="step">2. Signed activity + SSO token</text>

  <rect x="567" y="365" width="56" height="53" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="579" y="386" class="pill" fill="#1d4ed8">VERIFY</text>
  <text x="576" y="403" class="actor-subtitle">signature</text>

  <path d="M595 440 L825 440" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="634" y="429" class="step">3. Authenticated platform identity</text>

  <path d="M825 490 L825 540" stroke="#f97316" stroke-width="5" fill="none"/>
  <rect x="700" y="486" width="250" height="58" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="719" y="510" class="note-title">4. Resolve trusted membership</text>
  <text x="719" y="530" class="note-body">derive tenant_id + role • fail closed</text>

  <!-- denied branch -->
  <rect x="485" y="563" width="455" height="68" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="508" y="588" class="note-title" fill="#991b1b">Unauthorized / missing / revoked membership</text>
  <text x="508" y="610" class="note-body">Return access denied. Do not call the Dify Gateway or retrieval path.</text>
  <path d="M825 544 L825 563" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>

  <!-- allowed branch -->
  <path d="M825 656 L1045 656" stroke="#059669" stroke-width="3.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="850" y="645" class="step">5. Authorized tenant_id + role</text>
  <rect x="842" y="667" width="185" height="25" rx="12" fill="#d1fae5"/>
  <text x="864" y="684" class="pill" fill="#047857">NO CALLER-SUPPLIED SCOPE</text>

  <path d="M1045 716 L1270 716" stroke="#059669" stroke-width="3.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="1074" y="705" class="step">6. Tenant-specific Dify app</text>

  <path d="M1270 766 L1460 766" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrowGray)"/>
  <text x="1297" y="755" class="step">7. Query / selected context</text>

  <path d="M1460 814 L1270 814" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowGray)"/>
  <text x="1302" y="803" class="step">8. Embedding / grounded response</text>

  <path d="M1270 850 L1045 850" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="1090" y="839" class="step">9. Answer + citations</text>

  <!-- Return result band -->
  <path d="M1045 885 L595 885" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M595 915 L370 915" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M370 945 L160 945" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="710" y="902" class="step">10. Record metrics; format response</text>
  <text x="411" y="933" class="step">11. Private Teams response</text>
  <text x="202" y="965" class="step">Answer + sources</text>

  <!-- Membership event note -->
  <rect x="68" y="790" width="330" height="92" rx="16" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="90" y="818" class="note-title">Out-of-band membership synchronization</text>
  <text x="90" y="841" class="note-body">Graph change events update AW5 membership.</text>
  <text x="90" y="861" class="note-body">Backend validation remains authoritative.</text>

  <rect x="418" y="790" width="490" height="92" rx="16" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
  <text x="440" y="818" class="note-title">Conversation isolation</text>
  <text x="440" y="841" class="note-body">Conversation state is scoped by platform_user_id + tenant_id.</text>
  <text x="440" y="861" class="note-body">Changing projects cannot reuse the previous tenant's memory.</text>
</svg>
