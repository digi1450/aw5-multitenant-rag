    - data:
        code: |-
          def main(
              tor_results: list,
              use_tor: str,
              sds_results: list,
              use_sds: str,
              er_results: list,
              use_er: str,
          ) -> dict:
              def enabled(value):
                  return (
                      value is True
                      or str(value or "").strip().lower()
                      in {"true", "1", "yes", "y"}
                  )

              merged = []
              seen_segments = set()

              manifest = []
              seen_sources = set()

              sources = (
                  ("TOR", enabled(use_tor), tor_results or []),
                  ("SDS", enabled(use_sds), sds_results or []),
                  ("ER", enabled(use_er), er_results or []),
              )

              for source_type, use_source, rows in sources:
                  if not use_source:
                      continue

                  for item in rows:
                      if not isinstance(item, dict):
                          continue

                      metadata = item.get("metadata") or {}

                      segment_key = (
                          str(metadata.get("dataset_id") or ""),
                          str(metadata.get("document_id") or ""),
                          str(metadata.get("segment_id") or ""),
                          str(item.get("content") or ""),
                      )

                      if segment_key not in seen_segments:
                          seen_segments.add(segment_key)
                          merged.append(item)

                      document_name = str(
                          metadata.get("document_name")
                          or item.get("document_name")
                          or item.get("title")
                          or ""
                      ).strip()

                      if document_name:
                          source_key = (
                              source_type,
                              document_name,
                          )

                          if source_key not in seen_sources:
                              seen_sources.add(source_key)
                              manifest.append(
                                  f"{source_type}: {document_name}"
                              )

              source_manifest = "\n".join(manifest)

              return {
                  "result": merged,
                  "source_manifest": source_manifest,
              }
