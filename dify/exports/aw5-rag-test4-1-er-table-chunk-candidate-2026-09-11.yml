    - data:
        code: "import json\n\n\ndef main(results: list, query: str) -> dict:\n   \
          \ if results is None:\n        results = []\n\n    if not isinstance(results,\
          \ list):\n        raise ValueError(\"results must be an array\")\n\n   \
          \ if not isinstance(query, str):\n        query = \"\"\n\n    query_normalized\
          \ = \" \".join(query.casefold().split())\n\n    # ใช้สำหรับตรวจ canonical\
          \ document_type เช่น TOR / SDS / ER\n    normalized_tokens = (\n       \
          \ query_normalized\n        .replace(\"`\", \" \")\n        .replace('\"\
          ', \" \")\n        .replace(\"'\", \" \")\n        .replace(\"(\", \" \"\
          )\n        .replace(\")\", \" \")\n        .split()\n    )\n\n    query_tokens\
          \ = {\n        token.rstrip(\".,;:!?\")\n        for token in normalized_tokens\n\
          \        if token.rstrip(\".,;:!?\")\n    }\n\n    valid_items = []\n\n\
          \    for item in results:\n        if not isinstance(item, dict):\n    \
          \        continue\n\n        content = item.get(\"content\")\n        if\
          \ not isinstance(content, str) or not content.strip():\n            continue\n\
          \n        metadata = item.get(\"metadata\")\n        if not isinstance(metadata,\
          \ dict):\n            metadata = {}\n\n        document_name = metadata.get(\"\
          document_name\", \"\")\n        if not isinstance(document_name, str):\n\
          \            document_name = \"\"\n\n        # Custom Metadata ของ Dify\
          \ อยู่ภายใน metadata.doc_metadata\n        doc_metadata = metadata.get(\"\
          doc_metadata\")\n        if not isinstance(doc_metadata, dict):\n      \
          \      doc_metadata = {}\n\n        document_type = doc_metadata.get(\"\
          document_type\", \"\")\n        if not isinstance(document_type, str):\n\
          \            document_type = \"\"\n\n        valid_items.append({\n    \
          \        \"item\": item,\n            \"metadata\": metadata,\n        \
          \    \"document_name\": document_name.strip(),\n            \"document_name_normalized\"\
          : document_name.strip().casefold(),\n            \"document_type\": document_type.strip(),\n\
          \            \"document_type_normalized\": document_type.strip().casefold(),\n\
          \        })\n\n    # ตรวจว่าผู้ใช้จำกัดขอบเขตแหล่งข้อมูลอย่างชัดเจนหรือไม่\n\
          \    thai_restriction = (\n        \"เฉพาะ\" in query_normalized\n     \
          \   and \"โดยเฉพาะ\" not in query_normalized\n    )\n\n    english_restriction\
          \ = any(\n        marker in query_normalized\n        for marker in (\n\
          \            \"only \",\n            \" only\",\n            \"solely\"\
          ,\n            \"exclusively\",\n        )\n    )\n\n    has_restriction\
          \ = thai_restriction or english_restriction\n\n    # ---------------------------------------------------------\n\
          \    # 1. ตรวจชื่อไฟล์จาก built-in metadata ของ Dify\n    # ---------------------------------------------------------\n\
          \    matched_document_names = set()\n\n    for entry in valid_items:\n \
          \       document_name = entry[\"document_name_normalized\"]\n\n        if\
          \ not document_name:\n            continue\n\n        if \".\" in document_name:\n\
          \            document_stem = document_name.rsplit(\".\", 1)[0]\n       \
          \ else:\n            document_stem = document_name\n\n        full_name_match\
          \ = document_name in query_normalized\n\n        stem_match = (\n      \
          \      len(document_stem) >= 4\n            and document_stem in query_normalized\n\
          \        )\n\n        if full_name_match or stem_match:\n            matched_document_names.add(document_name)\n\
          \n    # ---------------------------------------------------------\n    #\
          \ 2. ตรวจ canonical document_type จาก Custom Metadata\n    #    เช่น TOR\
          \ / SDS / ER\n    #\n    #    ใช้ exact token match เพื่อไม่ให้ \"ER\" ไป\
          \ match\n    #    ตัวอักษรที่เป็นส่วนหนึ่งของคำอื่น\n    # ---------------------------------------------------------\n\
          \    matched_document_types = set()\n\n    for entry in valid_items:\n \
          \       document_type = entry[\"document_type_normalized\"]\n\n        if\
          \ not document_type:\n            continue\n\n        if document_type in\
          \ query_tokens:\n            matched_document_types.add(document_type)\n\
          \n    # ---------------------------------------------------------\n    #\
          \ 3. ตรวจ explicit filename เช่น .pdf / .txt\n    # ---------------------------------------------------------\n\
          \    supported_extensions = (\n        \".pdf\",\n        \".txt\",\n  \
          \      \".md\",\n        \".doc\",\n        \".docx\",\n        \".csv\"\
          ,\n        \".xls\",\n        \".xlsx\",\n    )\n\n    explicit_file_reference\
          \ = any(\n        token.rstrip(\".,;:!?\").endswith(supported_extensions)\n\
          \        for token in normalized_tokens\n    )\n\n    source_restricted\
          \ = (\n        has_restriction\n        and (\n            bool(matched_document_names)\n\
          \            or bool(matched_document_types)\n            or explicit_file_reference\n\
          \        )\n    )\n\n    if source_restricted:\n        if matched_document_names\
          \ or matched_document_types:\n            selected_entries = [\n       \
          \         entry\n                for entry in valid_items\n            \
          \    if (\n                    entry[\"document_name_normalized\"]\n   \
          \                 in matched_document_names\n                    or\n  \
          \                  entry[\"document_type_normalized\"]\n               \
          \     in matched_document_types\n                )\n            ]\n    \
          \    else:\n            # ผู้ใช้ระบุไฟล์แบบจำกัดขอบเขต\n            # แต่\
          \ retrieval ไม่ได้ส่งไฟล์นั้นมา\n            # ส่ง context ว่างเพื่อป้องกันการตอบจากไฟล์อื่น\n\
          \            selected_entries = []\n\n    else:\n        # ไม่ได้จำกัด source:\n\
          \        # รักษา relevance order เดิมจาก Knowledge Retrieval\n        selected_entries\
          \ = valid_items[:10]\n\n    enriched_results = []\n\n    for entry in selected_entries:\n\
          \        item = entry[\"item\"]\n        metadata = entry[\"metadata\"]\n\
          \        content = item[\"content\"]\n\n        source = {}\n\n        for\
          \ key in (\n            \"document_id\",\n            \"document_name\"\
          ,\n            \"dataset_id\",\n            \"dataset_name\",\n        ):\n\
          \            value = metadata.get(key)\n\n            if isinstance(value,\
          \ str) and value.strip():\n                source[key] = value.strip()\n\
          \n        enriched_item = dict(item)\n        enriched_item[\"content\"\
          ] = (\n            \"SOURCE_METADATA: \"\n            + json.dumps(\n  \
          \              source,\n                ensure_ascii=False,\n          \
          \      separators=(\",\", \":\"),\n            )\n            + \"\\n\\\
          n\"\n            + content.strip()\n        )\n\n        enriched_results.append(enriched_item)\n\
          \n    return {\n        \"result\": enriched_results,\n        \"has_evidence\"\
          : bool(enriched_results),\n        \"evidence_count\": len(enriched_results),\n\
          \    }"
        code_language: python3
        outputs:
          evidence_count:
            children: null
            type: number
          has_evidence:
            children: null
            type: boolean
          result:
            children: null
            type: array[object]
