    - data:
        code: "def main(tor_results: list, use_tor: str, sds_results: list, use_sds:\
          \ str, er_results: list, use_er: str) -> dict:\n    def enabled(value):\n\
          \        return value is True or str(value).strip().lower() in {\"true\"\
          , \"1\", \"yes\", \"y\"}\n\n    merged = []\n    seen = set()\n\n    for\
          \ use, rows in (\n        (enabled(use_tor), tor_results or []),\n     \
          \   (enabled(use_sds), sds_results or []),\n        (enabled(use_er), er_results\
          \ or []),\n    ):\n        if not use:\n            continue\n        for\
          \ item in rows:\n            if not isinstance(item, dict):\n          \
          \      continue\n            metadata = item.get(\"metadata\") or {}\n \
          \           key = (\n                str(metadata.get(\"dataset_id\") or\
          \ \"\"),\n                str(metadata.get(\"document_id\") or \"\"),\n\
